        <div class="auth-act">
          <label>本机设备码（发给管理员，领取绑定此设备的专属卡密）</label>
          <div class="act-row">
            <input id="fpBox" readonly>
            <button class="btn-line" id="fpCopy">复制设备码</button>
          </div>
          <label>输入激活码（同一卡密不可重复叠加）</label>
          <div class="act-row">
            <input id="codeInput" placeholder="例如：FLUX-0030-6789-ABCD" spellcheck="false">
            <button class="btn-solid" id="actBtn">叠加激活</button>
          </div>
          <p class="hint">· <b>一机一卡</b>：每张卡密发卡时与设备码绑定，仅绑定的设备可用，转发卡密给他人无效。<br>· 领卡流程：复制上面的<b>设备码</b>发给管理员 → 获得专属卡密 → 在下方输入激活。<br>· <b>多卡叠加</b>：续费时激活新卡密，剩余时间自动累加，不会重置。<br>· 授权天数 1-9999 天或永久卡；被吊销的卡约 5 分钟内自动扣除。</p>
        </div>
