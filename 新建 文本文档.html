<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋仔科技</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
        body{
            background: linear-gradient(145deg,#222838,#111520);
            min-height:100vh;
            padding:20px;
            color:#fff;
        }
        .container{
            max-width:420px;
            margin:0 auto;
            background:#1b2030;
            border-radius:18px;
            padding:24px;
            border:1px solid #485274;
            box-shadow:0 0 25px #5867a855;
        }
        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:28px;
        }
        .title{
            font-size:24px;
            font-weight:bold;
            color:#7cf0ff;
        }
        .tip{
            color:#60ff98;
            font-size:14px;
        }
        .item{
            background:#272e42;
            border-radius:12px;
            padding:14px 18px;
            margin-bottom:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:1px solid #3a4460;
        }
        .item-name{
            font-size:16px;
        }
        .switch{
            width:44px;height:24px;
            background:#444;
            border-radius:20px;
            position:relative;
            cursor:pointer;
            transition: all 0.25s ease;
        }
        .switch::after{
            content:"";
            position:absolute;
            width:20px;height:20px;
            background:white;
            border-radius:50%;
            top:2px;
            left:2px;
            transition: all 0.25s ease;
        }
        .switch.active{
            background:#22bc70;
        }
        .switch.active::after{
            left:22px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">诀别蛋仔定制</div>
        <div class="tip">已稳定12天</div>
    </div>

    <div class="item">
        <span class="item-name">无限蛋币</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">无限金币</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">移速增加</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">人物飞天</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">人物穿墙</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">全地图透视</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">一键无敌</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">跳跃加强</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">自动夺冠</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">体型缩放</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">技能无CD</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">防检测</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <!--新增功能-->
    <div class="item">
        <span class="item-name">创建道具</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">重力修改</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">一键卡bug</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="item">
        <span class="item-name">人物隐身</span>
        <div class="switch active" onclick="this.classList.toggle('active')"></div>
    </div>
</div>
</body>
</html>
