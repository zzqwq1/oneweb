<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FLUX 发卡工具 — KEY ISSUER</title>
<style>
:root{--bg:#0f1923;--panel:#111c27;--line:rgba(236,232,225,.1);--ink:#ece8e1;--dim:#7e8c96;
--red:#ff4655;--teal:#3ecf9a;--f-num:'Rajdhani',sans-serif;--f-cn:'Noto Sans SC',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-cn);padding:36px 18px}
.wrap{max-width:660px;margin:0 auto}
h1{font-size:20px;letter-spacing:3px}
h1 span{font:600 11px var(--f-num);color:var(--red);letter-spacing:3px;margin-left:10px}
.sub{font-size:12px;color:var(--dim);margin:6px 0 22px}
.card{background:var(--panel);border:1px solid var(--line);padding:20px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--dim);letter-spacing:1px}
input{width:110px;padding:9px 12px;background:#0c141c;border:1px solid var(--line);color:var(--ink);font:600 15px var(--f-num);outline:none}
button{padding:10px 18px;background:var(--red);border:0;color:#fff;font:700 13px var(--f-cn);cursor:pointer;letter-spacing:2px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:hover{filter:brightness(1.15)}
.codes{margin-top:16px}
.code{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;margin-bottom:7px;
 background:#0c141c;border:1px solid var(--line);font:600 15px var(--f-num);letter-spacing:1px}
.code em{font-style:normal;font-size:11px;color:var(--teal);margin-left:10px}
.code button{padding:4px 12px;font-size:11px;background:transparent;border:1px solid var(--line);color:var(--dim);letter-spacing:0}
#msg{margin-top:10px;font-size:13px;min-height:20px}
#msg.ok{color:var(--teal)} #msg.bad{color:var(--red)}
.tip{font-size:11px;color:var(--dim);line-height:1.9;margin-top:14px;border-left:2px solid var(--line);padding-left:12px}
textarea{width:100%;height:110px;background:#0c141c;border:1px solid var(--line);color:var(--ink);
 font:12px monospace;padding:10px;outline:none;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <h1>FLUX 发卡工具<span>KEY ISSUER v1.0</span></h1>
  <p class="sub">签发 FLUX-0000-0000-AAAA 激活码 · 导出 cards.json 上传到仓库根目录即可生效</p>

  <div class="card">
    <div class="row">
      <div class="field"><label>授权天数（1-99）</label><input id="days" type="number" min="1" max="99" value="3"></div>
      <div class="field"><label>生成数量（1-50）</label><input id="count" type="number" min="1" max="50" value="5"></div>
      <button id="gen">批量生成</button>
      <button class="ghost" id="copyAll">复制全部</button>
      <button class="ghost" id="exportBtn">导出 cards.json</button>
    </div>
    <div class="codes" id="list"></div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div class="field" style="margin-bottom:8px"><label>合并已有 cards.json（粘贴旧文件内容，新卡会追加进去）</label></div>
    <textarea id="oldJson" placeholder='{"cards":[{"code":"FLUX-...","days":3}]}'></textarea>
    <p class="tip">· 卡密规则：数字段前两位 = 天数，后六位随机流水；末段 4 位大写字母为校验位（盐值 FLUX）。<br>
    · 网站 (index.html) 激活时会 fetch 仓库根目录的 <b>cards.json</b>：卡密必须在库内且校验位通过，天数以库内记录为准。<br>
    · 要作废某个卡密：编辑 cards.json 删掉对应条目后重新上传即可。<br>
    · 「导出」会自动把你粘贴的旧卡密与新卡合并成一份完整 cards.json。</p>
  </div>
</div>

<script>
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ';
function fluxChecksum(d8){
  let h=5381;
  for(const c of 'FLUX')h=(h*33+c.charCodeAt(0))>>>0;
  for(const c of d8)h=(h*33+c.charCodeAt(0))>>>0;
  let out='';
  for(let i=0;i<4;i++){h=(Math.imul(h,1103515245)+12345)>>>0;out+=ALPHA[h%24]}
  return out;
}
function genFlux(days){
  const dd=String(Math.min(99,Math.max(1,days|0))).padStart(2,'0');
  let r='';for(let i=0;i<6;i++)r+=Math.floor(Math.random()*10);
  const d8=dd+r;
  return `FLUX-${d8.slice(0,4)}-${d8.slice(4)}-${fluxChecksum(d8)}`;
}
let batch=[];
const $=s=>document.querySelector(s);
function msg(t,ok){const m=$('#msg');m.textContent=t;m.className=ok?'ok':'bad'}
function parseOld(){
  const v=$('#oldJson').value.trim();
  if(!v)return [];
  try{
    const j=JSON.parse(v);
    const arr=Array.isArray(j)?j:(j.cards||[]);
    return arr.filter(c=>c&&c.code&&c.days).map(c=>({code:String(c.code).toUpperCase(),days:+c.days}));
  }catch(e){msg('旧文件内容不是合法 JSON，已忽略',false);return []}
}
$('#gen').addEventListener('click',()=>{
  const days=parseInt($('#days').value,10),count=parseInt($('#count').value,10);
  if(!(days>=1&&days<=99)){msg('天数需在 1-99',false);return}
  if(!(count>=1&&count<=50)){msg('数量需在 1-50',false);return}
  const old=parseOld();
  const exist=new Set(old.map(c=>c.code));
  batch=[];
  while(batch.length<count){
    const c=genFlux(days);
    if(!exist.has(c)){exist.add(c);batch.push({code:c,days})}
  }
  $('#list').innerHTML=batch.map((b,i)=>
    `<div class="code"><span>${b.code}<em>${b.days} 天</em></span><button data-i="${i}">复制</button></div>`).join('');
  msg(`已生成 ${count} 个 ${days} 天卡密（与旧库去重合并）`,true);
});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  navigator.clipboard&&navigator.clipboard.writeText(batch[+b.dataset.i].code);
});
$('#copyAll').addEventListener('click',()=>{
  if(!batch.length){msg('请先生成卡密',false);return}
  navigator.clipboard&&navigator.clipboard.writeText(batch.map(b=>b.code).join('\n'));
  msg('已复制全部卡密',true);
});
$('#exportBtn').addEventListener('click',()=>{
  const all=parseOld().concat(batch);
  if(!all.length){msg('没有可导出的卡密',false);return}
  const blob=new Blob([JSON.stringify({cards:all},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='cards.json';a.click();
  URL.revokeObjectURL(a.href);
  msg(`已导出 cards.json（共 ${all.length} 个卡密），上传到仓库根目录即可生效`,true);
});
</script>
</body>
</html>
